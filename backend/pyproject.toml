[project]
name = "translator-backend"
version = "0.1.0"
description = "Agentic document translation backend (Google ADK)"
license = "LicenseRef-Proprietary"  # all rights reserved: see LICENSE at the repository root
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk[all]>=2.11",
    "litellm>=1.84",
    "markdown-it-py>=3",
    "openpyxl>=3.1.5",
    "pillow>=11",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "pyyaml>=6",
    "rapidfuzz>=3.14.6",
    "sse-starlette>=3.5.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
